[package]
name = "rig-dynclient"
version = "0.41.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/patonw/rig-dynclient.git"
description = "A dynamic provider client wrapper for rig"

[dependencies]
async-stream = "0.3.6"
delegate = "0.13.5"
disjoint_impls = { version = "1.3.7" }
enum-assoc = "1.3.0"
futures = "0.3.32"
kinded = "0.5.0"
rig-agent = { version = "0.41.0" }
rig-core = { version = "0.41.0" }
rig = { version = "0.41.0" }
rmcp = { version = "2.2.0", features = [
  "client",
  "server",
  "reqwest",                                  # required for some strange reason
  "transport-child-process",
  "transport-io",
  "transport-streamable-http-client",
  "transport-streamable-http-client-reqwest",
], optional = true }
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.17"

[features]
default = []
rmcp = ["dep:rmcp", "rig-agent/rmcp"]
audio = ["rig-core/audio"]
image = ["rig-core/image"]
